{% if prev_url or next_url %}
{% if prev_url %}
  <a href="{{ prev_url }}" class="page-nav-btn page-nav-prev" aria-label="Poprzednia strona">‹</a>
{% else %}
  <span class="page-nav-btn page-nav-prev is-disabled" aria-hidden="true">‹</span>
{% endif %}
{% if next_url %}
  <a href="{{ next_url }}" class="page-nav-btn page-nav-next" aria-label="Następna strona">›</a>
{% else %}
  <span class="page-nav-btn page-nav-next is-disabled" aria-hidden="true">›</span>
{% endif %}
{% endif %}
