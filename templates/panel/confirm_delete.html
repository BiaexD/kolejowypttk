{% extends 'panel/base_panel.html' %}
{% block title %}Usuń{% endblock %}

{% block content %}
<div class="panel-confirm">
  <h1>Na pewno usunąć?</h1>
  <p>„{{ label }}” zostanie usunięte bezpowrotnie.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Tak, usuń</button>
    <a href="{{ back_url }}" class="btn">Anuluj</a>
  </form>
</div>
{% endblock %}
